<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="p5.js"></script>
    <script src="mauri_audio_context.js"></script>  <!-- pins the AudioContext rate/latency; BEFORE p5.sound -->
    <script src="p5.sound.min.js"></script>

    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />
    <!-- Tablets: 1 CSS px per device px with zoom off, so taps aren't held back for double-tap-zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- "Add to Home Screen" on iPad runs it full-screen, without Safari's bars. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <main>
    </main>
    <!-- Ambience and effects -->
    <script src="mauri_audio.js"></script>

    <!-- Core systems -->
    <script src="mauri_registry.js"></script>
    <script src="mauri_spatial.js"></script>
    <script src="mauri_simulation.js"></script>

    <!-- Data definitions -->
    <script src="mauri_species_data.js"></script>
    <script src="mauri_entity_sprites.js"></script>

    <!-- Terrain and seasons -->
    <script src="mauri_projection.js"></script>  <!-- plan-oblique 3D projection (before terrain: the relief bake reads it) -->
    <script src="mauri_terrain.js"></script>
    <script src="mauri_climate_drift.js"></script>  <!-- Free Play deepening-glacial curve (pure; before seasons/sketch read it) -->
    <script src="mauri_seasons.js"></script>

    <!-- Base classes -->
    <script src="mauri_boid.js"></script>

    <!-- Entities -->
    <script src="mauri_moa.js"></script>
    <script src="mauri_eagle.js"></script>
    <script src="mauri_kereru.js"></script>  <!-- flighted-bird base (frugivore flyer) -->
    <script src="mauri_kokako.js"></script>  <!-- extends Kereru (must load after it) -->
    <script src="mauri_kea.js"></script>     <!-- alpine parrot; extends Kereru (load after it) -->
    <script src="mauri_kaka.js"></script>    <!-- forest parrot; extends Kereru (load after it) -->
    <script src="mauri_kakapo.js"></script>  <!-- flightless ground parrot; extends Kereru (load after it) -->
    <script src="mauri_egg.js"></script>
    <script src="mauri_plant.js"></script>
    <script src="mauri_placeable.js"></script>
    <script src="mauri_nesting.js"></script>  <!-- moa nesting sites (Kea Raid v2) -->
    <script src="mauri_module.js"></script>   <!-- module levels: story director, moa family + eagle scripts -->
    <script src="mauri_module_patotara.js"></script>   <!-- module 1 director + scripted kea (after mauri_module.js) -->

    <!-- UI -->
    <script src="mauri_UI.js"></script>
    <script src="mauri_menu_art.js"></script>  <!-- NEW -->
    <script src="mauri_tutorial.js"></script>

    <!-- Level system -->
    <script src="mauri_level_format.js"></script>
    <script src="mauri_progress.js"></script>

    <!-- Level definitions (registration order = level order) -->
    <script src="levels/module_00_storms.js"></script>  <!-- module 0 (Storms): small button above the cards -->
    <script src="levels/module_01_patotara.js"></script>  <!-- module 1 (Pātōtara); reuses module 0's land settings -->
    <script src="levels/level_01_kahurangi.js"></script>
    <script src="levels/level_02_glacial_kahurangi.js"></script>
    <script src="levels/level_03_alpine_lakes.js"></script>
    <script src="levels/level_freeplay_kahurangi.js"></script>  <!-- endless deepening-glacial Free Play -->
    <script src="mauri_encyclopedia.js"></script>

    <!-- Per-level tutorial scripts (register with TUTORIAL_REGISTRY) -->
    <script src="levels/tutorial_01_kahurangi.js"></script>
    <script src="levels/tutorial_02_glacial_kahurangi.js"></script>
    <script src="levels/tutorial_freeplay_kahurangi.js"></script>
    <script src="levels/tutorial_module_kit.js"></script>  <!-- shared scene/banner helpers for module scripts -->
    <script src="levels/tutorial_module_bookends.js"></script>  <!-- Te Whē's welcome + farewell, added to every module -->
    <script src="levels/tutorial_module_00_storms.js"></script>
    <script src="levels/tutorial_module_01_patotara.js"></script>

    <!-- Debug tools -->
    <script src="mauri_benchmark.js"></script>

    <!-- Rendering (WebGL port, see GL_PORT.md). Atlas packs loaded sprite PNGs into
         shared GPU pages and wraps image(); glbatch is the opt-in (?render=gl)
         DOM-stacked WebGL entity layer. Both load before sketch.js (which brings
         them up in setup()); inert with no effect until then. -->
    <script src="mauri_spriteatlas.js"></script>
    <script src="mauri_glbatch.js"></script>
    <script src="mauri_glterrain.js"></script>  <!-- Phase 5: GPU height-field terrain (?terrain=gl) -->

    <!-- Debug lenses: world-space balance-tuning overlays (toggle with L in debug). -->
    <script src="mauri_lens.js"></script>

    <!-- Main game (last) -->
    <script src="mauri_sketch.js"></script>
  </body>
</html>
